services:
  - type: web
    name: tg-tag
    runtime: python
    branch: main
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: ELEVENLABS_STT_MODEL
        value: scribe_v1
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: SCREENSHOT_API_KEY
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: AGENTROUTER_API_KEY
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: LIVE_MAX_MINUTES
        value: "180"
      - key: YOUTUBE_LISTENER_CHANNEL
        value: "@helenefischer"
      - key: YOUTUBE_LISTENER_INTERVAL
        value: "3600"
      - key: YOUTUBE_AUTO_UPLOAD
        value: "false"
      - key: YOUTUBE_UPLOAD_PRIVACY
        value: private
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_OAUTH_SETUP_TOKEN
        sync: false
